<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রাফা এন্টারপ্রাইজ - অর্ডার ও হিসাব</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1e88e5; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
    .price-info { font-size: 14px; color: #666; margin-top: 5px; }
    .total-box { background: #e3f2fd; padding: 15px; border-radius: 5px; text-align: center; font-size: 18px; font-weight: bold; color: #0d47a1; margin: 20px 0; }
    button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; font-weight: bold; }
    button:hover { background: #218838; }
  </style>
</head>
<body>

<div class="container">
  <h2>রাফা এন্টারপ্রাইজ</h2>
  
  <!-- Formspree Integration -->
  <form id="orderForm" action="https://formspree.io/f/xvkownvz" method="POST">
    
    <div class="form-group">
      <label for="name">গ্রাহকের নাম:</label>
      <input type="text" id="name" name="Customer Name" placeholder="আপনার নাম লিখুন" required>
    </div>

    <div class="form-group">
      <label for="phone">মোবাইল নম্বর:</label>
      <input type="tel" id="phone" name="Phone Number" placeholder="০১৭xxxxxxxx" required>
    </div>

    <div class="form-group">
      <label for="address">ডেলিভারি ঠিকানা:</label>
      <input type="text" id="address" name="Delivery Address" placeholder="ঠিকানা লিখুন" required>
    </div>

    <div class="form-group">
      <label for="product">পণ্য নির্বাচন করুন:</label>
      <select id="product" name="Product" onchange="calculateTotal()">
        <option value="khoa" data-price="90">ইটের খোয়া (৳৯০ / cft)</option>
        <option value="chips" data-price="65">চিপস পাথর (৳৬৫ / cft)</option>
        <option value="sand" data-price="0">বালু (আলোচনা সাপেক্ষে)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="quantity">পরিমাণ (cft):</label>
      <input type="number" id="quantity" name="Quantity (cft)" value="100" min="1" oninput="calculateTotal()" required>
    </div>

    <!-- হিডেন ফিল্ডে মোট দাম জমা হবে যাতে ইমেইলে দেখা যায় -->
    <input type="hidden" id="totalAmountInput" name="Total Estimated Amount">

    <div class="total-box">
      মোট আনুমানিক মূল্য: <span id="totalDisplay">৳ ৯,০০০</span>
    </div>

    <button type="submit">অর্ডার জমা দিন</button>
  </form>
</div>

<script>
  function calculateTotal() {
    const productSelect = document.getElementById('product');
    const selectedOption = productSelect.options[productSelect.selectedIndex];
    const pricePerCft = parseFloat(selectedOption.getAttribute('data-price'));
    const quantity = parseFloat(document.getElementById('quantity').value) || 0;
    
    const totalDisplay = document.getElementById('totalDisplay');
    const totalInput = document.getElementById('totalAmountInput');

    if (productSelect.value === 'sand') {
      totalDisplay.innerText = 'আলোচনা সাপেক্ষে';
      totalInput.value = 'আলোচনা সাপেক্ষে';
    } else {
      const total = pricePerCft * quantity;
      totalDisplay.innerText = '৳ ' + total.toLocaleString('bn-BD');
      totalInput.value = '৳ ' + total;
    }
  }

  // প্রারম্ভিক হিসাব
  calculateTotal();
</script>

</body>
</html>
